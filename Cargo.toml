[package]
name = "e2ee-notes"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.5", features = ["fs", "trace"] }
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
subtle = "2"

[profile.release]
lto = true
codegen-units = 1
strip = true
